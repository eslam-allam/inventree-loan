name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.7.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/inventree-loan
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Resolve release tag
        id: release
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          plugin_version="$(python -c 'import inventree_loan; print(inventree_loan.PLUGIN_VERSION)')"
          echo "Tag version:    ${tag_version}"
          echo "Plugin version: ${plugin_version}"
          if [ "${tag_version}" != "${plugin_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match PLUGIN_VERSION ${plugin_version}"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
